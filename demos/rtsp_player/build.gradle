plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 注意：如果项目级build.gradle中还没有Maven仓库，需要添加
// 请检查并确保项目级build.gradle中包含如下仓库：
// repositories {
//     google()
//     mavenCentral()
// }

android {
    namespace 'com.example.rtsp_player'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.rtsp_player"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    // 使用远程版本的 AndroidX Media3
    implementation 'androidx.media3:media3-common:1.0.0-alpha01'
    implementation 'androidx.media3:media3-exoplayer:1.0.0-alpha01'
    implementation 'androidx.media3:media3-ui:1.0.0-alpha01'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.0.0-alpha01'
}